<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow">
<title>Conversations</title>
<link rel="stylesheet" href="/surface-colors.css">
<link rel="stylesheet" href="/conversation-profiles.css?v=48">
<link rel="stylesheet" href="/reader-theme.css">
<script defer src="/reader-theme.js"></script>
<script type="module" src="/conversation-profiles.js?v=23"></script>
<style>.reader-nav,header .reader-nav{position:fixed;top:4px;right:132px;height:24px;display:inline-flex;align-items:center;gap:10px;margin:0;padding:0;z-index:270}.reader-nav .reader-link{display:inline-flex;align-items:center;font:500 11.5px/24px system-ui;color:inherit;opacity:.70;text-decoration:none;white-space:nowrap}.reader-nav .reader-link:hover,.reader-nav .reader-link:focus-visible{opacity:1;text-decoration:underline}body.chat-focus .reader-nav{z-index:9200}@media(pointer:coarse){.reader-nav,header .reader-nav{top:2px;right:142px}}</style>
</head>
<body>
<header><h1 id="title">Conversations</h1><button hidden type="button" id="profile-fullscreen" aria-label="Full screen" title="Full screen" aria-pressed="false"></button><nav id="profile-tabs" aria-label="Conversations"><a id="salon-link" class="nav-button" href="/go/hub">nikita</a><a id="salon-notes" class="nav-button" href="/go/hub">Notes</a><a id="back-to-chat" class="nav-button" href="/">Chat</a><a class="nav-button" title="LightCone authors" href="/go/lightcone">LC</a><a class="nav-button" title="Debri Physics authors" href="/go/debri">DB</a></nav></header>
<main>
<p id="fullscreen-status" class="hint" role="status" hidden></p>
<p class="intro">Independent settings for each conversation. Tabs keep unsaved edits. Saved changes sync across devices without overwriting your drafts.</p>
<p id="status" role="status" aria-live="polite">Loading...</p>
<div id="profiles"></div>
<footer class="hint">Pi Web · Nikita v0.10.1</footer>
</main>
<template id="profile-template">
<section hidden>
<div class="section-heading"><div><h2></h2><p class="identity"></p></div><span class="scope"></span></div>
<p class="hint notice" data-notice hidden></p>
<form>
<div class="grid">
<div class="model-pair"><div class="profile-picker-field"><span>Model</span><div class="profile-picker"><select name="model" aria-label="Model" hidden></select></div></div>
<div class="profile-picker-field"><span>Thinking</span><div class="profile-picker"><select name="thinking" aria-label="Thinking" hidden></select></div></div>
</div><div class="profile-picker-field"><span>Replies</span><div class="profile-picker"><select name="replyMode" aria-label="Replies" hidden>
<option value="mention_reply">Dir</option>
<option value="addressed">Addr</option>
<option value="all">All</option>
<option value="off">Off</option>
</select></div><p class="reply-hint" data-reply-hint></p></div>
</div>
<div class="field-heading"><label class="toggle"><input type="checkbox" name="toolsOn">Tools</label></div>
<p class="hint">Off removes tool definitions and execution access for future replies. Existing permissions and approval checks remain enforced.</p>
<div class="field-heading"><label class="toggle"><input type="checkbox" name="piOn">Pi</label></div>
<div data-pi-reference hidden><small>Installed Pi · original English reference. Tools, tool rules and working directory depend on each turn.</small><pre></pre></div>
<div class="field-heading"><label class="toggle"><input type="checkbox" name="baseOn">Base</label></div>
<p class="hint">Per-conversation instructions. With Pi on, these are added to its native instructions. With Pi off, only enabled profile instructions are used. Character and Custom follow in that order; Response style follows the current question. No hidden working-directory prompt is added after saving.</p>
<textarea name="basePrompt" rows="6" maxlength="30000" spellcheck="false" aria-label="Base system prompt" placeholder="Base instructions"></textarea>
<p class="hint">Memory and explicit replies may still add conversation context. Addressed mode adds participation instructions for name-only triggers; select Direct or All for a prompt-free test. Provider-owned instructions are outside these controls.</p>
<div class="field-heading"><label class="toggle"><input type="checkbox" name="systemPrompt">Character</label></div>
<textarea name="character" rows="5" maxlength="8000" spellcheck="false" aria-label="Character" placeholder="Character instructions"></textarea>
<div class="field-heading"><label class="toggle"><input type="checkbox" name="customOn">Custom</label></div>
<p class="hint">Additional system instructions, independent of Character and Response style. Disabling keeps the text without sending it to the model. Empty means none.</p>
<textarea name="customPrompt" rows="5" maxlength="20000" spellcheck="false" aria-label="Custom prompt" placeholder="Additional instructions"></textarea>
<div class="field-heading"><label class="toggle"><input type="checkbox" name="tailOn">Response style</label></div>
<p class="hint">Appended after the conversation and current question. Plain text or JSON is passed as written.</p>
<textarea name="tail" rows="4" maxlength="4000" spellcheck="false" aria-label="Response style" placeholder="Response style instructions"></textarea>
<div class="field-heading"><label class="toggle"><input type="checkbox" name="memory">Memory</label></div>
<div class="grid memory-grid">
<span class="number-slot"><input type="number" inputmode="numeric" required name="memoryLimit" aria-label="Earlier dialogue messages" title="Earlier dialogue messages" min="0" max="500" step="1"></span>
<span class="number-slot"><input type="number" inputmode="numeric" required name="backgroundLimit" aria-label="Earlier group messages" title="Earlier group messages" min="0" max="500" step="1"></span>
</div>
<p class="hint">Both sliders support 0–500 messages, one message per step. Save slider changes to apply them to future replies. Dialogue and group background are separate, byte-bounded windows; long messages may reduce the actual count. Memory off sends no automatic history. An explicit reply can still quote its target.</p>
<p class="hint" data-memory-scope role="status" aria-live="polite"></p>
<div class="actions"><button type="submit">Save</button><button type="button" data-action="reset">New Chat</button><button type="button" data-action="restore">Old Chat</button><span class="format-switches" role="group" aria-label="Reply format"><label class="toggle"><input type="checkbox" name="textOutput">Text</label><label class="toggle"><input type="checkbox" name="voiceOutput">Voice</label></span><span class="feedback" role="status" aria-live="polite"></span></div>
<p class="hint" data-reset-hint>New Chat starts a fresh context only here. Old Chat reopens all retained history here, including before resets; saved message limits and the Memory switch still apply. Neither deletes stored history, cancels active replies or restores messages already removed from storage.</p>
</form>
</section>
</template>
</body>
</html>
