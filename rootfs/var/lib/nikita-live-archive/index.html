<style>:root { --divider-ink:#383838; color-scheme: dark; background: #000; color: #bdbdbd; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 14px; line-height: 1.6; }
* { box-sizing: border-box; }
body { margin: 0; background: #000; }
main { max-width: 1120px; margin: 0 auto; padding: 12px 48px 96px; min-width: 0; }
a { color: inherit; text-decoration-color: #555; text-underline-offset: .18em; overflow-wrap: anywhere; }
a:hover { color: #d0d0d0; text-decoration-color: #999; }
a:focus-visible { outline: 1px solid #888; outline-offset: 5px; }
nav { margin-bottom: 32px; font-size: .8rem; color: #858585; }
nav a { text-decoration: none; color: #bdbdbd; }
.salon-header {position:sticky;top:0;z-index:10;background:#000;border:0;padding:0 12px;display:grid;grid-template-columns:minmax(0,1fr);align-items:center;min-height:32px}
.salon-nav {display:flex;align-items:center;flex-wrap:wrap;gap:0 .75em;margin:0;min-height:32px;font:400 1rem/32px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.salon-nav[hidden] {display:none}
.salon-nav::-webkit-scrollbar {display:none}
.salon-nav a {position:relative;flex:none;color:#515050}
.salon-nav a[aria-current],.salon-nav a:hover,.salon-nav a:focus-visible {color:#eee}
.salon-nav a+a::before {content:"";position:absolute;left:-.375em;top:50%;transform:translateY(-50%);height:1.12em;width:1px;background:var(--divider-ink);pointer-events:none}
html {scroll-padding-top:32px}

h1,.status,.count,.identity,.back,.empty{font-size:1rem}.message-date{display:block;color:#858585;font-size:1rem;line-height:1.6;margin:.35rem 0 0;white-space:normal}.message{border-bottom:1px solid var(--divider-ink)}.message + .message{border-top:0}.message-body>:last-child{margin-bottom:0}.authors li{padding:7px 0;border-bottom:1px solid var(--divider-ink)}.archive-summary{color:#858585}@media(max-width:680px){main{padding:10px 22px 64px}.message{padding:16px 0}}</style>
