<!doctype html>
<html lang="ru" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARRI — shell</title>
<link rel="icon" href="data:,">
<script>
/* Каркас: держим состояние панелей до первой отрисовки, чтобы не мигало. */
(function () {
  try {
    var d = document.documentElement;
    var lc = localStorage.getItem('shell.leftCollapsed');
    var rc = localStorage.getItem('shell.rightCollapsed');
    var lw = Number(localStorage.getItem('shell.leftW'));
    var rw = Number(localStorage.getItem('shell.rightW'));
    d.classList.toggle('boot-left-collapsed', lc === '1');
    d.classList.toggle('boot-right-collapsed', rc === '1');
    if (lw) d.style.setProperty('--left-w', Math.max(160, Math.min(520, lw)) + 'px');
    if (rw) d.style.setProperty('--right-w', Math.max(200, Math.min(560, rw)) + 'px');
  } catch (e) {}
})();
</script>
<style>
  /* ============================================================
     ПАЛИТРА — та же, что в редакторе ARRI. Менять только здесь.
     ============================================================ */
  :root{
    --bg:#1c1f24; --canvas:#22262c; --panel:#24282e;
    --line:#32373e; --line-2:#3d434b;
    --ink:#e4e8ed; --ink-2:#9aa3ad; --ink-3:#6f7880;
    --accent:#e0594d; --ok:#6fc99a; --warn:#e8b486;
    --hover:#2c3138;
    --rail:28px;               /* ширина вертикальных рейлов */
    --left-w:190px;            /* ширина левой панели */
    --right-w:300px;           /* ширина правой панели */
    --shadow-l: 6px 0 18px -8px rgba(0,0,0,.45);
    --shadow-r: -6px 0 18px -8px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{background:#12151a}
  body{
    margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font:13px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }

  /* ---------- верхняя панель ---------- */
  .topbar{
    height:30px;flex:0 0 30px;display:flex;align-items:center;gap:4px;
    padding:0;background:var(--panel);border-bottom:1px solid var(--line);
    position:relative;z-index:60;
  }
  /* кнопки у кромок топбара — ровно шириной рейла (28px) */
  /* кнопки у кромок: 28px, в такой же рамке, как live и chat */
  /* кнопки у кромок: квадрат, высота и рамка как у live/chat */
  .topbar .tb-btn.tb-menu,.topbar .tb-btn.tb-panel{
    flex:0 0 var(--rail);width:var(--rail);height:22px;padding:0;
    margin:0;
    border:1px solid #313a45;border-radius:5px;
    background:transparent;color:#8e99a6;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .topbar .tb-btn.tb-menu{flex:0 0 var(--rail);width:var(--rail);margin-left:0;margin-right:6px}
  .topbar .tb-btn.tb-menu svg,.topbar .tb-btn.tb-panel svg{width:13px;height:13px}
  .topbar .tb-btn.tb-menu:hover,.topbar .tb-btn.tb-panel:hover{background:var(--hover);color:var(--ink);border-color:var(--line-2)}

  /* все кнопки топбара одной ширины — не «скачут» при переключении */
  /* фиксированная ширина ТОЛЬКО у кнопки-перехода: подпись меняется,
     а размер нет. live и chat остаются как были. */
  .topbar .tb-btn.tb-jump{
    flex:0 0 68px;width:68px;height:22px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    text-decoration:none;box-sizing:border-box;
    border:1px solid #313a45;border-radius:5px;background:transparent;
    color:#8e99a6;font-size:11px;white-space:nowrap;overflow:hidden;
  }
  .topbar .tb-btn.tb-live{
    flex:0 0 44px;width:44px;height:22px;padding:0;margin:0;
    display:inline-flex;align-items:center;justify-content:center;
    box-sizing:border-box;border:1px solid #313a45;border-radius:5px;
    background:transparent;color:#8e99a6;font-size:11px;font-weight:500;
  }
  .topbar .tb-btn.tb-chat{
    flex:0 0 60px;width:60px;height:22px;padding:0;margin:0;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    box-sizing:border-box;border:1px solid #313a45;border-radius:5px;
    background:transparent;color:#8e99a6;font-size:11px;font-weight:500;
    text-decoration:none!important;
  }
  .topbar .tb-btn.tb-live:hover,.topbar .tb-btn.tb-chat:hover{
    background:var(--hover);color:var(--ink);border-color:var(--line-2);
  }
  .topbar .tb-btn.tb-jump:hover{
    background:var(--hover);color:var(--ink);border-color:var(--line-2);
  }
  .tb-right{display:flex;align-items:center;gap:3px;flex:0 0 auto;margin-right:0}
  /* логотип: одинаковый шрифт и высота строки во всех страницах */
  .topbar .brand{
    font:700 15px/22px Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    color:#e6ebf1;letter-spacing:-.02em;
    margin:0 4px 0 0;padding:0;white-space:nowrap;
    display:inline-block;height:22px;line-height:22px;
  }
  .topbar .brand span{display:inline;margin:0;padding:0}
  .topbar .brand span{color:#d94f3d;margin-left:0;font-size:inherit;letter-spacing:inherit;font-weight:inherit;line-height:inherit;vertical-align:baseline}
  .topbar .spacer{flex:1}
  .tb-btn{
    font:inherit;font-size:11px;padding:3px 7px;cursor:pointer;
    background:transparent;color:var(--ink-2);
    border:1px solid transparent;border-radius:5px;
    display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    text-decoration:none;transition:background .13s,color .13s,border-color .13s;
  }
  .tb-btn:hover{background:var(--hover);color:var(--ink);border-color:var(--line-2)}
  .tb-btn.lit{border-color:#35516e;color:#a9c4dd}
  .tb-btn svg{display:block}
  .tb-sep{width:1px;height:14px;background:var(--line-2);margin:0 3px}

  /* ---------- рабочая область ---------- */
  .app{flex:1 1 auto;min-height:0;display:flex;position:relative;overflow:hidden}

  /* рейлы */
  .toolrail{
    flex:0 0 var(--rail);width:var(--rail);background:var(--panel);
    display:flex;flex-direction:column;align-items:center;
    padding:5px 0;gap:1px;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:none;-ms-overflow-style:none;position:relative;z-index:80;
  }
  .toolrail::-webkit-scrollbar{width:0;height:0}
  .toolrail-l{border-right:1px solid var(--line)}
  .toolrail-r{border-left:1px solid var(--line)}
  .tl-btn{
    width:24px;height:24px;flex:0 0 24px;background:transparent;
    border:1px solid transparent;border-radius:6px;color:#7a8290;
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    transition:background .13s,color .13s,border-color .13s;
  }
  .tl-btn:hover{background:var(--hover);color:var(--ink)}
  .tl-btn.on{background:#3b6ea8;color:#fff}
  .tl-btn svg{display:block;width:14px;height:14px;min-width:14px;min-height:14px;flex:0 0 14px}
  .tl-btn.big svg{width:18px;height:18px;min-width:18px;min-height:18px;flex:0 0 18px}
  .tl-sep{width:16px;height:1px;background:var(--line);margin:3px 0;flex:0 0 1px}

  /* холст */
  .stage{
    flex:1 1 auto;min-width:0;position:relative;
    background:var(--canvas);overflow:hidden;
  }
  /* Сюда инструмент вставляет своё содержимое */
  .stage-slot{position:absolute;inset:0}

  /* ---------- панели поверх холста ---------- */
  .side{
    position:absolute;top:0;bottom:0;z-index:40;
    background:var(--panel);display:flex;flex-direction:column;
    min-height:0;
  }
  .side-left{
    left:var(--rail);width:var(--left-w);border-right:1px solid var(--line);
    box-shadow:var(--shadow-l);
  }
  .side-right{
    right:var(--rail);width:var(--right-w);border-left:1px solid var(--line);
    box-shadow:var(--shadow-r);
  }
  html.boot-left-collapsed .side-left,
  body.left-collapsed .side-left{display:none}
  html.boot-right-collapsed .side-right,
  body.right-collapsed .side-right{display:none}

  /* тело панели: свой скролл, без видимой полосы */
  .side-scroll{
    flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;
    padding:16px 15px 12px;box-sizing:border-box;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .side-scroll::-webkit-scrollbar{width:0;height:0}
  /* текст всегда внутри панели: переносится, не вылезает */
  .side{overflow:hidden}
  .side-scroll{overflow-wrap:anywhere;word-break:break-word}
  .side-scroll *{max-width:100%;box-sizing:border-box}

  /* ручка ресайза: тянется мышкой, ширина запоминается */
  .side-resize{
    position:absolute;top:0;bottom:0;width:8px;cursor:col-resize;z-index:60;
    background:transparent;
  }
  .side-resize:hover,.side-resize.dragging{background:transparent}
  .side-left .side-resize{right:0}
  .side-right .side-resize{left:0}
  body.left-collapsed .side-left .side-resize,
  body.right-collapsed .side-right .side-resize{display:none}

  /* заголовки внутри панели — инструмент может использовать */
  .side h2{
    font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--ink-3);margin:14px 0 8px;
  }
  .side h2:first-child{margin-top:0}
  .side .muted{color:var(--ink-2);font-size:11.5px;line-height:1.55}

  /* пустое состояние */
  .empty{
    border:1px dashed var(--line-2);border-radius:7px;padding:14px;
    color:var(--ink-3);font-size:11.5px;text-align:center;
  }

  /* мобильная раскладка */
  @media(max-width:760px){
    .side-left,.side-right{width:min(86vw,320px)}
  }
</style>
</head>
<body>

<!-- ============ ВЕРХНЯЯ ПАНЕЛЬ ============ -->
<header class="topbar" id="topbar">
  <button class="tb-btn tb-menu" id="btnMenu" aria-label="Меню">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
  </button>
  <div class="brand">CurveLab<span>.</span></div>

  <!-- слот инструмента в топбаре: сюда вставляются его кнопки -->
  <div class="tb-slot" id="tbSlot" style="display:flex;align-items:center;gap:4px;flex:0 0 auto;margin-left:8px"></div>

  <span class="spacer"></span>

  <div class="tb-right">
    <a class="tb-btn tb-jump" href="/loopform" title="Перейти в loopform">loopform</a>
    <button class="tb-btn tb-live" id="btnLive" type="button" title="показывать курсор другим">live</button>
    <a class="tb-btn tb-chat" href="/" title="Вернуться в чат" aria-label="Вернуться в чат">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2.5h11v8h-6l-3 3v-3h-2z"/></svg>
      chat
    </a>
    <button class="tb-btn tb-panel" id="btnPanelToggle" type="button" title="Панель" aria-label="Панель">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h8M2 8h12M2 12h6"/><circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none"/><circle cx="10" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
  </button>
  </div>
</header>

<!-- ============ РАБОЧАЯ ОБЛАСТЬ ============ -->
<div class="app" id="app">

  <!-- левый рейл: инструменты -->
  <aside class="toolrail toolrail-l" id="railLeft">
    <button class="tl-btn on" id="btnLeft" title="Левая панель" aria-label="Левая панель">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="2.5" width="12" height="11" rx="1.6"/><path d="M6 2.5v11"/></svg>
    </button>
  </aside>

  <!-- холст -->
  <main class="stage" id="stage">
    <div class="stage-slot" id="stageSlot"></div>
  </main>

  <!-- правая панель -->
  <aside class="side side-right" id="sideRight">
    <span class="side-resize" id="resizeRight"></span>
    <div class="side-scroll" id="sideRightBody">
      <h2>Панель</h2>
      <div class="muted">Правая панель пустая. Инструмент добавляет сюда свои настройки.</div>
    </div>
  </aside>

  <!-- левая панель -->
  <aside class="side side-left" id="sideLeft">
    <span class="side-resize" id="resizeLeft"></span>
    <div class="side-scroll" id="sideLeftBody">
      <h2>Слои</h2>
      <div class="empty">Здесь будут слои инструмента</div>
    </div>
  </aside>

  <!-- правый рейл -->
  <aside class="toolrail toolrail-r" id="railRight">
    <button class="tl-btn on" id="btnRight" title="Правая панель" aria-label="Правая панель">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="2.5" width="12" height="11" rx="1.6"/><path d="M10 2.5v11"/></svg>
    </button>
    <div class="tl-sep"></div>
    <a class="tl-btn big" href="/" title="Вернуться в чат" aria-label="Вернуться в чат" style="text-decoration:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.6 8.4c-1.9 0-3.4 1.6-3.4 3.6s1.5 3.6 3.4 3.6c1.6 0 2.7-.9 3.7-2.1l2.3-3c1-1.2 2.1-2.1 3.7-2.1 1.9 0 3.4 1.6 3.4 3.6s-1.5 3.6-3.4 3.6c-1.6 0-2.7-.9-3.7-2.1l-2.3-3c-1-1.2-2.1-2.1-3.7-2.1z"/>
      </svg>
    </a>
  </aside>

</div>

<script>
/* ============================================================
   МЕХАНИКА КАРКАСА. Ничего про инструменты — только панели,
   рейлы и ресайз. Инструмент подключает своё через registerTool().
   ============================================================ */
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  var K_LEFT = 'shell.leftCollapsed';
  var K_RIGHT = 'shell.rightCollapsed';
  var K_LW = 'shell.leftW';
  var K_RW = 'shell.rightW';

  /* ---------- сворачивание панелей ---------- */
  function setLeft(open){
    document.body.classList.toggle('left-collapsed', !open);
    document.documentElement.classList.remove('boot-left-collapsed');
    var b = $('btnLeft'); if (b) b.classList.toggle('on', open);
    try { localStorage.setItem(K_LEFT, open ? '0' : '1'); } catch(e){}
  }
  function setRight(open){
    document.body.classList.toggle('right-collapsed', !open);
    document.documentElement.classList.remove('boot-right-collapsed');
    var b = $('btnRight'); if (b) b.classList.toggle('on', open);
    try { localStorage.setItem(K_RIGHT, open ? '0' : '1'); } catch(e){}
  }
  var openLeft  = !document.documentElement.classList.contains('boot-left-collapsed');
  var openRight = !document.documentElement.classList.contains('boot-right-collapsed');
  setLeft(openLeft);
  setRight(openRight);

  if ($('btnLeft'))  $('btnLeft').onclick  = function(){ openLeft = !openLeft;  setLeft(openLeft); };
  if ($('btnRight')) $('btnRight').onclick = function(){ openRight = !openRight; setRight(openRight); };

  /* ---------- ресайз панелей мышкой ---------- */
  function makeResize(handleId, panelId, key, min, max, side){
    var h = $(handleId), p = $(panelId);
    if (!h || !p) return;
    h.addEventListener('pointerdown', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var startX = ev.clientX;
      var startW = p.getBoundingClientRect().width;
      h.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      var last = startW;
      function move(e){
        var d = side === 'left' ? (e.clientX - startX) : (startX - e.clientX);
        last = Math.max(min, Math.min(max, startW + d));
        document.documentElement.style.setProperty(
          side === 'left' ? '--left-w' : '--right-w', Math.round(last) + 'px');
      }
      function up(){
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        h.classList.remove('dragging');
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        /* ширину НЕ сбрасываем: она уже записана в переменную */
        try { localStorage.setItem(key, String(Math.round(last))); } catch(e){}
        window.dispatchEvent(new Event('resize'));
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  }
  makeResize('resizeLeft', 'sideLeft', K_LW, 160, 520, 'left');
  makeResize('resizeRight', 'sideRight', K_RW, 200, 560, 'right');

  /* ---------- API для инструмента ---------- */
  /* Инструмент вызывает registerTool({ ... }) и получает готовый каркас:
     - topbar: массив элементов для верхней панели
     - railLeft / railRight: кнопки рейлов
     - stage: содержимое холста
     - leftPanel / rightPanel: содержимое панелей
     Ничего не ломается, если слот не заполнен. */
  window.registerTool = function(tool){
    tool = tool || {};
    if (tool.onReady) { try { tool.onReady(); } catch(e){ console.error(e); } }
    return { openLeft: function(){ openLeft = true;  setLeft(true); },
             openRight: function(){ openRight = true; setRight(true); } };
  };

  /* Перерисовка содержимого холста инструмента (если ему нужно) */
  window.dispatchEvent(new Event('shell:ready'));
})();
</script>
<script>
/* Кнопка «панель» в топбаре — тот же тумблер правой панели, что и на рейле. */
(function(){
  var b = document.getElementById('btnPanelToggle');
  var r = document.getElementById('btnRight');
  if (b && r) b.onclick = function(){ r.click(); };
})();
</script>
</body>
</html>
