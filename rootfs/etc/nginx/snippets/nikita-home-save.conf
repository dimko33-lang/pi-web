location = /_nikita_save_check {
 internal;
 proxy_pass http://127.0.0.1:5670/api/settings;
 proxy_pass_request_body off;
 proxy_set_header Content-Length "";
 proxy_set_header Host $host;
 proxy_set_header Cookie $http_cookie;
}
location = /api/project/download/source {
 limit_except GET { deny all; }
 auth_request /_nikita_save_check;
 proxy_pass http://unix:/run/nikita-home-save.sock:/export;
 proxy_pass_request_headers off;
 proxy_pass_request_body off;
 proxy_set_header Content-Length "";
 proxy_buffering off;
 proxy_read_timeout 300s;
}
