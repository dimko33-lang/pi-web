location = / {
 error_page 418 = @site_entry;
 if ($arg_key) { return 418; }
 proxy_pass http://127.0.0.1:5670;
 proxy_http_version 1.1;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header Accept-Encoding "";
 proxy_buffering off;
 proxy_read_timeout 3600s;
 sub_filter '</body>' '<script defer src="/_site/navigation.js"></script></body>';
 sub_filter '</head>' '<script src="/_site/workspace-title.js"></script></head>';
 sub_filter_once on;
}
location @site_entry {
 proxy_pass http://127.0.0.1:5690;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_read_timeout 15s;
}
location = /_site/navigation.js {
 proxy_pass http://127.0.0.1:5690;
 proxy_set_header Host $host;
}
