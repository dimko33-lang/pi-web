# Owner-only catalog. Reader grants are bound to a single slug + random token.
location = /nikita { return 302 /nikita/$is_args$args; }
location = /nikita/ {
    if ($n33_legacy_article) { return 302 $n33_legacy_article; }
    if ($n33_owner = 0) { return 401; }
    rewrite ^ /nikita/index.html last;
}
location = /nikita/index.html { if ($n33_owner = 0) { return 401; } alias /var/www/nikita-site/index.html; }
location ~ ^/nikita/(curvelab|arri|lake|owner_dm|guest_dm)/$ { if ($n33_owner = 0) { return 401; } rewrite ^ /nikita/index.html last; }
location ~ ^/nikita/archive/(piwep|lightcone|curvelab|arri|lake|owner_dm|guest_dm)/(messages\.json|[0-9]+-[0-9]+\.(?:jpg|png|webp|gif|mp4|ogg|bin))$ { if ($n33_owner = 0) { return 401; } alias /var/lib/nikita-salon-history/$1/$2; }
location = /nikita/lightcone { if ($n33_owner = 0) { return 401; } return 302 /nikita/lightcone/; }
location = /nikita/lightcone/ { if ($n33_owner = 0) { return 401; } rewrite ^ /nikita/index.html last; }
location = /nikita/piwep/ { if ($n33_owner = 0) { return 401; } rewrite ^ /nikita/index.html last; }
location = /nikita/piwep/messages.json { if ($n33_owner = 0) { return 401; } alias /var/lib/nikita-salon-piwep/messages.json; }
location ~ ^/nikita/piwep/photos/([0-9]+)\.jpg$ { if ($n33_owner = 0) { return 401; } alias /var/lib/nikita-salon-piwep/$1.jpg; }
location = /nikita/lightcone/media.json { if ($n33_owner = 0) { return 401; } alias /var/lib/nikita-salon-piwep/lightcone/messages.json; }
location ~ ^/nikita/lightcone/photos/([0-9]+)\.jpg$ { if ($n33_owner = 0) { return 401; } alias /var/lib/nikita-salon-piwep/lightcone/$1.jpg; }
location = /nikita/lightcone/messages.json { if ($n33_owner = 0) { return 401; } alias /var/lib/nikita-live-archive/messages/user@@ACCOUNT_ID@@.json; }
location ~ ^/nikita/(app\.js|style\.css|vendor/(?:marked\.js|purify\.js|plotly\.js|katex/katex\.min\.(?:js|css)|katex/fonts/[A-Za-z0-9_-]+\.woff2))$ { alias /var/www/nikita-site/$1; }
location ~ "^/nikita/(?<n33_slug>[0-9]{4}-[0-9]{2}-[0-9]{2}/[a-z0-9-]+)/$" {
    if ($n33_legacy_article) { return 302 $n33_legacy_article; }
    set $n33_page $n33_owner;
    if (-f /var/lib/nikita-publications/.article-links/$n33_slug/$n33_token.json) { set $n33_page 1; }
    if ($n33_page = 0) { return 401; }
    rewrite ^ /nikita/_article_shell.html last;
}
location = /nikita/_article_shell.html { internal; alias /var/www/nikita-site/index.html; }
location ~ "^/nikita/([0-9]{4}-[0-9]{2}-[0-9]{2}/[a-z0-9-]+)/read/([0-9a-f]{32})\.json$" {
    log_not_found off;
    alias /var/lib/nikita-publications/.article-links/$1/$2.json;
}
location = /nikita/data/index.json { if ($n33_owner = 0) { return 401; } alias /var/lib/nikita-publications/index.owner.json; }
location ~ "^/nikita/data/([a-f0-9]{24})\\.json$" { if ($n33_owner = 0) { return 401; } alias /var/lib/nikita-publications/$1.json; }
location /nikita/ { return 404; }
