# Only the panel-authorized ticket consumer can issue this session.
map $cookie_n33owner $n33_owner {
 default 0;
 "@@SALON_COOKIE@@" 1;
}
map $arg_a $n33_token {
 default invalid;
 "~^[0-9a-f]{32}$" $arg_a;
}
map $uri $n33_cache { default "no-cache"; ~^/nikita(?:/|$) "private, no-store"; }
map $uri $n33_loggable { default $d33_reader_loggable; ~^/nikita(?:/|$) 0; }
