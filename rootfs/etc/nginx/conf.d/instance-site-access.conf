# Owner-only access for the static readers: a key link sets a cookie.
map $arg_key $d33_cookie { default ""; "@@READER_ACCESS@@" "d33=@@READER_COOKIE@@; Path=/; HttpOnly; Secure; SameSite=Lax"; }
map "$cookie_d33:$arg_key" $d33_ok { default 0; ~^@@READER_COOKIE@@: 1; ~:@@READER_ACCESS@@$ 1; }

# Debri requires the session granted by the panel's one-use DB ticket.
map $cookie_d33debri $d33_debri_session_ok {
    default 0;
    "@@ARCHIVE_COOKIE@@" 1;
}
map $uri $d33_reader_scope {
    default closed;
    / landing;
    /install public_installer;
    /pi-web-card-v2.png card_image;
    /pi-web-install-graphite.png card_image;
    /pi-web-curl-graphite-v4.png card_image;
    /pi-web-card-c83fed50.png card_image;
    ~^/debri(?:/|$) debri;
    ~^/lc(?:/|$) lc;
    ~^/nikita(?:/|$) public;
    /robots.txt public;
}
map $d33_reader_scope $d33_reader_ok {
    default 0;
    landing 1;
    public_installer 1;
    card_image 1;
    debri $d33_debri_session_ok;
    lc $d33_ok;
    public 1;
}
map $d33_reader_scope $d33_reader_cookie {
    default "";
    lc $d33_cookie;
    public $d33_cookie;
}
# Only the real upstream's successful Debri single-use ticket redemption has this tuple.
map "$uri:$upstream_status:$upstream_http_location" $d33_debri_ticket_cookie {
    default "";
    "/nikita/_enter:303:/debri/" "d33debri=@@ARCHIVE_COOKIE@@; Path=/; HttpOnly; Secure; SameSite=Lax";
}
# Do not store access links in the access log.
map $arg_key $d33_reader_loggable {
    "" 1;
    default 0;
}
