[Service]
User=pi-browser
Group=pi-browser
WorkingDirectory=/srv/pi-workspaces/browser/rootfs/opt/pi-web
EnvironmentFile=
EnvironmentFile=/srv/pi-workspaces/browser/rootfs/etc/pi-web.env
Environment=HOME=/srv/pi-workspaces/browser/rootfs/root
Environment=PI_WEB_AGENT_ROOT=/srv/pi-workspaces/browser/rootfs/opt/projects
Environment=PI_WEB_SESSIONS_DIR=/srv/pi-workspaces/browser/rootfs/opt/pi-web/sessions
Environment=PI_WEB_SHARED_SYSTEM_PROMPT=/srv/pi-workspaces/browser/rootfs/etc/browser-system.txt
Environment=PI_WEB_TELEGRAM_BASE=/srv/pi-workspaces/nikita/rootfs/opt/projects/tg-agent/working-rules.md
Environment=PI_WEB_TELEGRAM_DATA=/srv/pi-workspaces/nikita/rootfs/opt/pi-web/data
Environment=PI_WEB_BROWSER_ADMIN=1
NoNewPrivileges=no
PrivateTmp=no
PrivateDevices=no
ProtectSystem=no
ProtectHome=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectControlGroups=no
ProtectClock=no
ProtectProc=default
RestrictSUIDSGID=no
RestrictRealtime=no
LockPersonality=no
CapabilityBoundingSet=~
ReadWritePaths=
InaccessiblePaths=
Environment=PI_WEB_TOOL_ENVIRONMENT=/srv/pi-workspaces/browser/rootfs/opt/ENVIRONMENT.md
